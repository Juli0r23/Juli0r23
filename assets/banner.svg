<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Julio A. Romero · Juli0r23 · Estudiante ASIR · Ciberseguridad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    PALETA:
      fondo  #080c10 · panel #0d1117 · borde #1a2332
      texto  #e6edf3 · apagado #8b949e
      verde  #00ff88 · rojo #f78166
    Nota: GitHub renderiza este SVG como <img>, sin fuentes web.
    Se usan fuentes del sistema como fallback.
  -->
  <defs>
    <style>
      .mono  { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .serif { font-family: Georgia,'Iowan Old Style','Times New Roman',serif; }
      .txt   { fill: #e6edf3; }
      .dim   { fill: #8b949e; }
      .green { fill: #00ff88; }
      .red   { fill: #f78166; }
      .in    { animation: aparecer .6s ease-out both; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .7s; }
      .d3 { animation-delay: 1.2s; } .d4 { animation-delay: 1.7s; }
      .cursor { animation: parpadeo 1.1s steps(1) infinite; }
      @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes parpadeo { 50% { opacity: 0; } }
    </style>
    <pattern id="rejilla" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0d1117" stroke-width="1"/>
    </pattern>
    <linearGradient id="desvanecer" x1="0" x2="1">
      <stop offset="0" stop-color="#080c10" stop-opacity="1"/>
      <stop offset=".55" stop-color="#080c10" stop-opacity=".2"/>
      <stop offset="1" stop-color="#080c10" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo y rejilla -->
  <rect width="1200" height="320" rx="12" fill="#080c10"/>
  <rect x="0" y="40" width="1200" height="280" fill="url(#rejilla)"/>
  <rect x="0" y="40" width="1200" height="280" fill="url(#desvanecer)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="12" fill="none" stroke="#1a2332"/>

  <!-- Barra de ventana de terminal -->
  <path d="M12 .5H1188A11.5 11.5 0 0 1 1199.5 12V40H.5V12A11.5 11.5 0 0 1 12 .5Z" fill="#0d1117"/>
  <line x1="0" y1="40.5" x2="1200" y2="40.5" stroke="#1a2332"/>
  <circle cx="26" cy="20" r="6" fill="#f78166"/>
  <circle cx="46" cy="20" r="6" fill="#30363d"/>
  <circle cx="66" cy="20" r="6" fill="#00ff88"/>
  <text x="600" y="25" text-anchor="middle" class="mono dim" font-size="13">julio@server: ~</text>

  <!-- Prompt -->
  <text x="60" y="98" class="mono in d1" font-size="18">
    <tspan class="green">julio@server</tspan><tspan class="dim">:</tspan><tspan class="red">~</tspan><tspan class="dim">$ </tspan><tspan class="txt">whoami</tspan>
  </text>

  <!-- Nombre (serif editorial) -->
  <text x="58" y="172" class="serif txt in d2" font-size="62" font-style="italic" letter-spacing="-1">Julio A. Romero<tspan class="green">.</tspan></text>
  <rect x="60" y="192" width="96" height="3" fill="#00ff88" class="in d2"/>

  <!-- Subtítulo -->
  <text x="60" y="232" class="mono in d3" font-size="19">
    <tspan class="dim">// </tspan><tspan class="txt">ciberseguridad</tspan><tspan class="dim"> · </tspan><tspan class="red">redes</tspan><tspan class="dim"> + </tspan><tspan class="green">sistemas</tspan><tspan class="dim"> · </tspan><tspan class="txt">ASIR 2º</tspan>
  </text>

  <!-- Línea final con cursor -->
  <text x="60" y="276" class="mono in d4" font-size="18">
    <tspan class="green">julio@server</tspan><tspan class="dim">:</tspan><tspan class="red">~</tspan><tspan class="dim">$ </tspan><tspan class="green cursor">█</tspan>
  </text>

  <!-- Detalle decorativo: stack -->
  <g class="mono green" font-size="14" text-anchor="end" opacity=".28">
    <text x="1140" y="100">Jekyll · GitHub Pages</text>
    <text x="1140" y="124">Cisco IOS · Linux</text>
    <text x="1140" y="148">SSH · VLANs · Debian</text>
  </g>
  <text x="1140" y="182" class="mono dim" font-size="12" text-anchor="end" opacity=".65">julior23.es · Extremadura, España</text>
</svg>
